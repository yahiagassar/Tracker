<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الموقع الجغرافي</title>
</head>
<body>

    <h2 id="status">جاري طلب إذن الموقع الجغرافي...</h2>

    <script>
        const APP_ID = 'O6raaZTs7mijebvMLgF3iLisXJlV2sDaFarukCTt';
        const REST_KEY = 'YCwT4Z5H7oNvZhWUAh222gCIbLyY1krffJX3t9m6';
        const CLASS_NAME = 'UserLocation';

        function getLocationAndSend() {
            const statusElement = document.getElementById('status');

            // 1. التحقق من دعم المتصفح للـ Geolocation
            if (!navigator.geolocation) {
                statusElement.innerText = "متصفحك لا يدعم تحديد الموقع الجغرافي.";
                statusElement.style.color = "red";
                return;
            }

            // 2. طلب إحداثيات الـ GPS من المتصفح
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const latitude = position.coords.latitude;   // خط العرض
                    const longitude = position.coords.longitude; // خط الطول
                    const accuracy = position.coords.accuracy;   // نسبة الدقة بالمتر

                    statusElement.innerText = "تمت جلب الإحداثيات، جاري الإرسال...";

                    // 3. إرسال البيانات إلى Back4App
                    try {
                        const response = await fetch(`https://parseapi.back4app.com/classes/${CLASS_NAME}`, {
                            method: 'POST',
                            headers: {
                                'X-Parse-Application-Id': APP_ID,
                                'X-Parse-REST-API-Key': REST_KEY,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                latitude: latitude,
                                longitude: longitude,
                                accuracyMeters: accuracy,
                                // تنسيق مخصص لـ GeoPoint في Parse/Back4App لسهولة عرضها على الخريطة
                                location: {
                                    "__type": "GeoPoint",
                                    "latitude": latitude,
                                    "longitude": longitude
                                }
                            })
                        });

                        if (response.ok) {
                            statusElement.innerText = "تم تسجيل الموقع الجغرافي بنجاح!";
                            statusElement.style.color = "green";
                        } else {
                            const errData = await response.json();
                            statusElement.innerText = "خطأ في الإرسال: " + (errData.error || "تأكد من الإعدادات");
                            statusElement.style.color = "red";
                        }

                    } catch (err) {
                        statusElement.innerText = "حدث خطأ في الاتصال: " + err.message;
                        statusElement.style.color = "red";
                    }
                },
                // التعامل مع أخطاء رفض الإذن أو عدم التمكن من التحديد
                (error) => {
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            statusElement.innerText = "تم رفض إذن الوصول للموقع من قبل المستخدم.";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            statusElement.innerText = "معلومات الموقع غير متوفرة حالياً.";
                            break;
                        case error.TIMEOUT:
                            statusElement.innerText = "انتهت مهلة طلب الموقع.";
                            break;
                        default:
                            statusElement.innerText = "حدث خطأ غير معروف أثناء جلب الموقع.";
                    }
                    statusElement.style.color = "red";
                },
                // خيارات إضافية لدقة أفضل
                {
                    enableHighAccuracy: true, // استخدام GPS الدقيق إن وجد
                    timeout: 10000,           // أقصى مهلة للانتظار (10 ثواني)
                    maximumAge: 0             // عدم استخدام موقع مخزن قديماً
                }
            );
        }

        window.onload = getLocationAndSend;
    </script>
</body>
</html>
